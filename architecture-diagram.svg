<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5B6472"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#C0392B"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1E8E5A"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#B7791F"/>
    </marker>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F6F8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1A2233" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="900" fill="#FBFCFD"/>

  <text x="600" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1A2233">Email Reply AI Agent — System Architecture</text>
  <text x="600" y="66" text-anchor="middle" font-size="13" fill="#5B6472">Gmail-integrated, agentic tool-calling pipeline powered by Groq LLM (no RAG / vector store)</text>

  <!-- Orchestrator -->
  <g filter="url(#softShadow)">
    <rect x="470" y="96" width="260" height="56" rx="10" fill="#1A2233"/>
  </g>
  <text x="600" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">main.py — Orchestrator Loop</text>
  <text x="600" y="138" text-anchor="middle" font-size="10.5" fill="#C9D2DC">Polls every N seconds (default 60s)</text>

  <line x1="600" y1="152" x2="600" y2="184" stroke="#5B6472" stroke-width="2" marker-end="url(#arrow)"/>
  <circle r="4" fill="#2C6ECB">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M600,152 L600,184"/>
  </circle>

  <!-- Fetcher -->
  <g filter="url(#softShadow)">
    <rect x="450" y="186" width="300" height="58" rx="10" fill="url(#cardGrad)" stroke="#D5DAE1"/>
  </g>
  <text x="600" y="210" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1A2233">Email Fetcher</text>
  <text x="600" y="228" text-anchor="middle" font-size="10.5" fill="#5B6472">step2_fetcher.py — fetches unread Gmail messages</text>

  <line x1="600" y1="244" x2="600" y2="276" stroke="#5B6472" stroke-width="2" marker-end="url(#arrow)"/>
  <circle r="4" fill="#2C6ECB">
    <animateMotion dur="2.2s" begin="0.3s" repeatCount="indefinite" path="M600,244 L600,276"/>
  </circle>

  <!-- State Guard -->
  <g filter="url(#softShadow)">
    <rect x="420" y="278" width="360" height="58" rx="10" fill="url(#cardGrad)" stroke="#D5DAE1"/>
  </g>
  <text x="600" y="302" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1A2233">Duplicate / State Guard</text>
  <text x="600" y="320" text-anchor="middle" font-size="10.5" fill="#5B6472">step3_state.py — AI-Processed label + SQLite: done?</text>

  <!-- skip branch from state guard -->
  <path d="M780,307 C 900,307 960,307 990,307" stroke="#B7791F" stroke-width="2" fill="none" marker-end="url(#arrowAmber)"/>
  <text x="915" y="298" font-size="10.5" fill="#B7791F" font-weight="600">already seen</text>
  <rect x="992" y="280" width="130" height="54" rx="8" fill="#FFF7E8" stroke="#EAD3A0"/>
  <text x="1057" y="302" text-anchor="middle" font-size="11.5" fill="#8A5A17" font-weight="700">SKIP</text>
  <text x="1057" y="318" text-anchor="middle" font-size="9.5" fill="#8A5A17">(seen before)</text>

  <line x1="600" y1="336" x2="600" y2="368" stroke="#5B6472" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="614" y="358" font-size="10" fill="#5B6472">new</text>
  <circle r="4" fill="#2C6ECB">
    <animateMotion dur="2.2s" begin="0.6s" repeatCount="indefinite" path="M600,336 L600,368"/>
  </circle>

  <!-- Guardrails -->
  <g filter="url(#softShadow)">
    <rect x="390" y="370" width="420" height="66" rx="10" fill="url(#cardGrad)" stroke="#D5DAE1"/>
  </g>
  <text x="600" y="394" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1A2233">Guardrails &amp; Pre-LLM Rules</text>
  <text x="600" y="411" text-anchor="middle" font-size="10.5" fill="#5B6472">step5_guardrails.py — spam / auto-mail / rate limit /</text>
  <text x="600" y="425" text-anchor="middle" font-size="10.5" fill="#5B6472">injection, legal &amp; refund-dispute rules (zero-token)</text>

  <!-- spam branch -->
  <path d="M810,403 C 930,403 990,403 1020,403" stroke="#C0392B" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="900" y="394" font-size="10.5" fill="#C0392B" font-weight="600">confirmed spam</text>
  <rect x="1022" y="375" width="145" height="56" rx="8" fill="#FDEDEC" stroke="#F1B7AF"/>
  <text x="1094" y="398" text-anchor="middle" font-size="11.5" fill="#922B21" font-weight="700">Move to Spam</text>
  <text x="1094" y="414" text-anchor="middle" font-size="9.5" fill="#922B21">Gmail Spam label</text>

  <!-- forced escalation branch -->
  <path d="M810,425 C 870,470 1060,520 1040,640" stroke="#C0392B" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="862" y="500" font-size="10" fill="#C0392B" font-weight="600">legal / refund /</text>
  <text x="862" y="513" font-size="10" fill="#C0392B" font-weight="600">injection / VIP</text>

  <line x1="600" y1="436" x2="600" y2="468" stroke="#5B6472" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="614" y="458" font-size="10" fill="#5B6472">passed</text>
  <circle r="4" fill="#2C6ECB">
    <animateMotion dur="2.2s" begin="0.9s" repeatCount="indefinite" path="M600,436 L600,468"/>
  </circle>

  <!-- Agent Core -->
  <g filter="url(#softShadow)">
    <rect x="380" y="470" width="440" height="86" rx="10" fill="#EAF2FE" stroke="#B9D3F7"/>
  </g>
  <text x="600" y="495" text-anchor="middle" font-size="14" font-weight="700" fill="#123A6B">Agent Core — Groq LLM (tool-calling)</text>
  <text x="600" y="513" text-anchor="middle" font-size="10.5" fill="#2C4A70">step4_agent.py — single call: intent, priority, sentiment,</text>
  <text x="600" y="528" text-anchor="middle" font-size="10.5" fill="#2C4A70">language detection + confidence score + decision</text>
  <text x="600" y="546" text-anchor="middle" font-size="10" fill="#5B6472" font-style="italic">decides: reply_to_email / skip / escalate_to_human</text>
  <circle cx="360" cy="513" r="6" fill="#2C6ECB">
    <animate attributeName="r" values="5;9;5" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- three branches -->
  <path d="M470,556 C 430,600 300,610 220,640" stroke="#B7791F" stroke-width="2" fill="none" marker-end="url(#arrowAmber)"/>
  <path d="M600,556 L600,640" stroke="#1E8E5A" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M730,556 C 800,600 900,610 970,640" stroke="#C0392B" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>

  <circle r="4" fill="#B7791F"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M470,556 C 430,600 300,610 220,640"/></circle>
  <circle r="4" fill="#1E8E5A"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M600,556 L600,640"/></circle>
  <circle r="4" fill="#C0392B"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M730,556 C 800,600 900,610 970,640"/></circle>

  <text x="250" y="600" text-anchor="middle" font-size="10.5" fill="#B7791F" font-weight="600">SKIP</text>
  <text x="600" y="600" text-anchor="middle" font-size="10.5" fill="#1E8E5A" font-weight="600">REPLY</text>
  <text x="940" y="600" text-anchor="middle" font-size="10.5" fill="#C0392B" font-weight="600">ESCALATE</text>

  <!-- outcome cards -->
  <g filter="url(#softShadow)">
    <rect x="120" y="642" width="200" height="54" rx="9" fill="#FFF7E8" stroke="#EAD3A0"/>
  </g>
  <text x="220" y="664" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8A5A17">No Action Needed</text>
  <text x="220" y="680" text-anchor="middle" font-size="9.5" fill="#8A5A17">e.g. newsletters, FYI, auto-mail</text>

  <g filter="url(#softShadow)">
    <rect x="500" y="642" width="200" height="54" rx="9" fill="#EAF7EF" stroke="#B9E3C6"/>
  </g>
  <text x="600" y="664" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E6B44">step6_sender.py</text>
  <text x="600" y="680" text-anchor="middle" font-size="9.5" fill="#1E6B44">Real Gmail send, in-thread reply</text>

  <g filter="url(#softShadow)">
    <rect x="880" y="642" width="200" height="54" rx="9" fill="#FDEDEC" stroke="#F1B7AF"/>
  </g>
  <text x="980" y="664" text-anchor="middle" font-size="11.5" font-weight="700" fill="#922B21">Needs-Human / Needs-Review</text>
  <text x="980" y="680" text-anchor="middle" font-size="9.5" fill="#922B21">stays unread; low-confidence draft saved</text>

  <!-- converge to logger -->
  <path d="M220,696 C 220,740 560,760 590,772" stroke="#5B6472" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M600,696 L600,772" stroke="#5B6472" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M980,696 C 980,740 640,760 610,772" stroke="#5B6472" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- Logger -->
  <g filter="url(#softShadow)">
    <rect x="430" y="774" width="340" height="60" rx="10" fill="#1A2233"/>
  </g>
  <text x="600" y="799" text-anchor="middle" font-size="13.5" font-weight="700" fill="#FFFFFF">Logger &amp; State Writer</text>
  <text x="600" y="817" text-anchor="middle" font-size="10.5" fill="#C9D2DC">step7_logger.py — logs + SQLite + review dashboard</text>

  <!-- legend -->
  <g font-size="10.5" fill="#5B6472">
    <circle cx="60" cy="855" r="5" fill="#1E8E5A"/><text x="72" y="859">Reply path</text>
    <circle cx="170" cy="855" r="5" fill="#B7791F"/><text x="182" y="859">Skip path</text>
    <circle cx="270" cy="855" r="5" fill="#C0392B"/><text x="282" y="859">Escalation path</text>
    <circle cx="410" cy="855" r="5" fill="#2C6ECB"/><text x="422" y="859">Data / control flow</text>
  </g>
</svg>
